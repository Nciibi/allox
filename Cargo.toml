[package]
name = "allox"
version = "0.1.0"
edition = "2021"
rust-version = "1.79"
description = "A pure-Rust, thread-cached general-purpose memory allocator. Zero dependencies, no C toolchain."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Nciibi/allox"
documentation = "https://github.com/Nciibi/allox#readme"
homepage = "https://github.com/Nciibi/allox"
categories = ["memory-management", "no-std"]
keywords = ["allocator", "malloc", "global-allocator", "memory"]
readme = "README.md"
exclude = ["target", "scripts", "*.md.tmp"]

[lib]
name = "allox"

[features]
default = ["std"]
# Hosted-platform support (TLS fast path, abort-on-corruption diagnostics,
# OS-thread yielding in the heap mutex). Disable for no_std/embedded targets,
# where a single global cache behind the allocator's spin mutex is used.
std = []
# Built-in allocation telemetry (thread-local counters, batched publication).
# Opt-in so production builds pay exactly zero for it; enable and query via
# `allox::telemetry::snapshot()`.
telemetry = []
# C comparators (mimalloc, snmalloc) for the benchmark matrix. OFF by
# default, and that is load-bearing rather than cosmetic: Cargo builds every
# dev-dependency when it builds any test, bench or example, so leaving these
# unconditional made `cargo test` require a working C toolchain — on this
# project's own dev box `cargo test --lib` failed at `libmimalloc-sys` with
# "link.exe not found" and ran zero tests. A crate whose pitch is "zero build
# scripts, no C toolchain" cannot have its own test suite gated on one.
# Enable with `--features bench-c` for the full scoreboard.
bench-c = ["dep:mimalloc", "dep:snmalloc-rs"]
# Dev-only: jemalloc bench comparator (needs make+autoconf — CI box only).
# NEVER enable for library consumers; default build stays zero-deps/no-C.
bench-jemalloc = ["dep:tikv-jemallocator"]
# Pure-Rust comparators (talc, dlmalloc) for the benchmark matrix, behind
# `bench-compare`. Optional *regular* dependencies rather than dev-dependencies
# for the same reason as `bench-c`: Cargo does not allow dev-dependencies to be
# optional, and it builds every dev-dependency whenever it builds any test,
# bench or example — so unconditional dev-dependencies meant `cargo test
# --all-targets` failed on illumos and the BSDs, where `dlmalloc 0.2`'s `global`
# feature has no implementation, even though nothing there references it.
# Feature-gating keeps them out of the graph entirely on those targets.
# See the note on `[[bench]] required-features` below.
bench-compare = ["dep:talc", "dep:spinning-top", "dep:dlmalloc"]
# Process-global app benchmark (examples/app_workload.rs). Exactly one
# backend feature selects the installed `#[global_allocator]`, so the
# measured process has no runtime dispatch on the allocation path — one
# binary per allocator, as a real deployment would. `app-p99` adds
# sampled per-call latency (a second binary; see the script).
app-allox = []
app-system = []
# The C backends pull their optional dependency in, so selecting one of
# these is enough to build it; `bench-c` is only needed for the matrix harness.
app-mimalloc = ["dep:mimalloc"]
app-snmalloc = ["dep:snmalloc-rs"]
app-talc = ["dep:talc", "dep:spinning-top"]
app-p99 = []

[dependencies]
# Benchmark comparators only — never dependencies of the library itself.
# They are optional regular dependencies rather than dev-dependencies
# because Cargo does not allow dev-dependencies to be optional, and making
# them unconditional is what made `cargo test` require a C toolchain: Cargo
# builds every dev-dependency whenever it builds any test, bench or example,
# so their cc-rs build scripts ran (and failed, "link.exe not found") even
# for `cargo test --lib`. Gating on a feature is the only lever that keeps
# them out of the default graph. Same treatment tikv-jemallocator already
# has; the default build is still zero-dependency.
#
# None of these are reachable unless the matching feature is enabled, and
# none of them are documented for library consumers.
mimalloc = { version = "0.1", optional = true }
snmalloc-rs = { version = "0.7", features = ["build_cc"], optional = true }
tikv-jemallocator = { version = "0.6", optional = true }
# Pure-Rust comparators. Optional for the reason spelled out at `bench-compare`:
# as dev-dependencies they were built by every `cargo test --all-targets`,
# including on targets where `dlmalloc`'s `global` feature does not exist.
talc = { version = "5", optional = true }
spinning-top = { version = "0.3", optional = true }
dlmalloc = { version = "0.2", features = ["global"], optional = true }

[[bench]]
name = "alloc"
harness = false
# `cargo bench` alone therefore runs *nothing*. That is a loud failure, not a
# silent one, because Cargo skips a target whose required-features are unmet
# rather than erroring — so the README and the bench docs both say
# `cargo bench --features bench-compare`. The alternative (no
# required-features) leaves the comparator crates referenced unconditionally and
# breaks `--all-targets` lint on illumos and the BSDs, which is the wart this
# is fixing.
required-features = ["bench-compare"]


[lints.rust]
# `cfg(kani)` is set by cargo-kani, not a Cargo feature. check-cfg needs
# rustc ≥1.80 (warning itself is 1.80+); MSRV 1.79 just ignores this table
# key's effect on an unknown lint — no build break.
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
