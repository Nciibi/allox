name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        rust: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo build --verbose
      - run: cargo test --verbose
      - run: cargo test --release --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --target wasm32-unknown-unknown --example wasm_smoke
      - run: node scripts/wasm_smoke.mjs target/wasm32-unknown-unknown/debug/examples/wasm_smoke.wasm
      - run: cargo build --release --target wasm32-unknown-unknown --example wasm_smoke
      - run: node scripts/wasm_smoke.mjs target/wasm32-unknown-unknown/release/examples/wasm_smoke.wasm

  bit32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
      # 32-bit ALU: 512 MiB arena const + frequent (safe) legacy fallback.
      # Runs natively on x86_64 runners; arena unit tests use small isolated
      # instances on any pointer width, so exhaustion/fallback shapes are
      # covered here too.
      - run: cargo build --target i686-unknown-linux-gnu --verbose
      - run: cargo test --target i686-unknown-linux-gnu --verbose

  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo bench -- --nocapture 2>&1 | tee bench-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-*.txt

  profile:
    runs-on: ubuntu-latest
    # Informational only: perf availability varies by runner kernel; this job
    # must never fail the build. Feeds the profile-guided tuning points
    # (mixed-all per-op latency, spawn-churn exit work) with counter data
    # the dev box cannot produce (no PMU there).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install perf (best effort)
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq linux-tools-common linux-tools-generic
      - name: Build benches
        run: cargo bench --no-run
      - name: perf stat on mixed-all 8T + spawn-churn
        continue-on-error: true
        run: |
          for wl in "mixed-all 8T" "spawn-churn"; do
            safe=$(echo "$wl" | tr ' ' '-');
            BENCH_SECS=2 BENCH_REPS=1 BENCH_ONLY="$wl" perf stat -e task-clock,context-switches,cpu-migrations,page-faults,minor-faults,major-faults,cycles,instructions,cache-misses -o "perf-${safe}.txt" cargo bench --bench alloc -- --nocapture || true;
          done
          ls perf-*.txt 2>/dev/null || echo "no perf output captured" > perf-unavailable.txt
      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-profiles
          path: perf-*.txt

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: actions-rs/install@v0.1
        with:
          crate: cargo-fuzz
      - run: cargo fuzz build
      - name: Smoke-run fuzz targets
        run: |
          cargo fuzz run alloc_seq -- -max_total_time=60
          cargo fuzz run zero_init_seq -- -max_total_time=60

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      # Miri cannot execute real syscalls for map/unmap; core unit tests only.
      - run: cargo +nightly miri test --lib
