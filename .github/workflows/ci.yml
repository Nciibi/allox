name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        rust: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo build --verbose
      - run: cargo test --verbose
      - run: cargo test --release --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --target wasm32-unknown-unknown --example wasm_smoke
      - run: node scripts/wasm_smoke.mjs target/wasm32-unknown-unknown/debug/examples/wasm_smoke.wasm
      - run: cargo build --release --target wasm32-unknown-unknown --example wasm_smoke
      - run: node scripts/wasm_smoke.mjs target/wasm32-unknown-unknown/release/examples/wasm_smoke.wasm

  bit32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
      # 32-bit ALU: 512 MiB arena const + frequent (safe) legacy fallback.
      # Runs natively on x86_64 runners; arena unit tests use small isolated
      # instances on any pointer width, so exhaustion/fallback shapes are
      # covered here too.
      - run: cargo build --target i686-unknown-linux-gnu --verbose
      - run: cargo test --target i686-unknown-linux-gnu --verbose

  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo bench -- --nocapture 2>&1 | tee bench-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-*.txt

  profile:
    runs-on: ubuntu-latest
    # Informational only: perf availability varies by runner kernel; this job
    # must never fail the build. Feeds the profile-guided tuning points
    # (mixed-all per-op latency, spawn-churn exit work) with counter data
    # the dev box cannot produce (no PMU there).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install perf (best effort)
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq linux-tools-common linux-tools-generic
      - name: Build benches
        run: cargo bench --no-run
      - name: perf stat on mixed-all 8T + spawn-churn
        continue-on-error: true
        run: |
          for wl in "mixed-all 8T" "spawn-churn"; do
            safe=$(echo "$wl" | tr ' ' '-');
            BENCH_SECS=2 BENCH_REPS=1 BENCH_ONLY="$wl" perf stat -e task-clock,context-switches,cpu-migrations,page-faults,minor-faults,major-faults,cycles,instructions,cache-misses -o "perf-${safe}.txt" cargo bench --bench alloc -- --nocapture || true;
          done
          ls perf-*.txt 2>/dev/null || echo "no perf output captured" > perf-unavailable.txt
      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-profiles
          path: perf-*.txt

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - uses: actions-rs/install@v0.1
        with:
          crate: cargo-fuzz
      - run: cargo fuzz build
      - name: Smoke-run fuzz targets
        run: |
          cargo fuzz run alloc_seq -- -max_total_time=60
          cargo fuzz run zero_init_seq -- -max_total_time=60
          cargo fuzz run tier_boundary_seq -- -max_total_time=60

  miri:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      # Miri cannot execute real syscalls for map/unmap; unit tests that
      # need raw mmap are cfg_attr(miri, ignore). Span/big carve and
      # large_header_of probes use std::alloc buffers and run here.
      # -Zmiri-strict-provenance: pointer-int casts in header probes must
      # stay in-bounds of their allocations.
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test --lib
        env:
          MIRIFLAGS: "-Zmiri-strict-provenance"

  # Phase 0.3: Windows Fls path is exercised by the 3-OS `test` matrix
  # (windows-latest runs tests/thread_exit.rs + stress.rs) and the 3-OS
  # `bench` matrix — no separate job needed; kept as a comment so the
  # coverage is visible when reviewing CI.
  #
  # Phase 0.7: 3-OS bench matrix is the existing `bench` job above.

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate LCOV report
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Summary
        run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info

  # Phase 0.4: jemalloc comparator — CI box has make+autoconf (dev box does
  # not). Runs the full 14-workload scoreboard with the extra column; upload
  # for re-scoring against the other OS bench artifacts.
  jemalloc-bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install make + autoconf (jemalloc build)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq make autoconf
      - name: Bench with jemalloc column
        run: cargo bench --features bench-jemalloc -- --nocapture 2>&1 | tee bench-jemalloc.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-jemalloc
          path: bench-jemalloc.txt

  # Phase 0.6: Kani proofs for DESIGN_SPANS_BIG §6 P1–P6 (arithmetic bounds)
  # + medium-page packing. Nightly + kani-verifier; proofs live in
  # src/page.rs `kani_proofs` under `#[cfg(all(kani, unix, feature = "std"))]`.
  kani:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Run carving proofs
        run: cargo kani
