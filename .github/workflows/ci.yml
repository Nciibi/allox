name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly, off the hour to avoid the top-of-hour runner stampede.
    - cron: "37 4 * * 1"

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

# A new push to the same branch makes the previous run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Gating jobs. Fast, deterministic, no timing claims. These are the checks
  # that block a change.
  # ---------------------------------------------------------------------------

test:
    name: test (${{ matrix.os }}, ${{ matrix.profile }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        profile: [debug, release]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --verbose --locked
      - name: Test (${{ matrix.profile }})
        run: cargo test --verbose --locked ${{ matrix.profile == 'release' && '--release' || '' }}
      # Telemetry is a separate compile universe, and it is also where the
      # platform-divergent counters live: how many times a doubling realloc
      # chain relocates depends on whether the arena exists. Running it only
      # on Linux let a Windows-only assertion sit in the suite unnoticed.
      - name: Telemetry tests
        if: matrix.profile == 'debug'
        run: cargo test --locked --features telemetry

  # The suite is what proves the allocator is correct; clippy and rustfmt
  # are cheap and run once rather than across the OS matrix.
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --locked -- -D warnings

  # Separate from lint because rustdoc under -D warnings also validates
  # intra-doc links, and a broken link in a public crate is a release bug.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo doc --no-deps --locked
        env:
          RUSTDOCFLAGS: -Dwarnings

  # The telemetry feature and the no_std configuration are separate compile
  # universes: a change can be green on default and break either.
  features:
    name: telemetry + no_std
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Telemetry build + tests
        run: |
          cargo build --locked --features telemetry
          cargo test --locked --features telemetry
      - name: no_std build (unix)
        run: cargo build --locked --no-default-features
      - name: no_std build (wasm32)
        run: cargo build --locked --no-default-features --target wasm32-unknown-unknown

  wasm32:
    name: wasm32 smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build debug + release
        run: |
          cargo build --locked --target wasm32-unknown-unknown --example wasm_smoke
          cargo build --locked --release --target wasm32-unknown-unknown --example wasm_smoke
      - name: Smoke debug
        run: node scripts/wasm_smoke.mjs target/wasm32-unknown-unknown/debug/examples/wasm_smoke.wasm
      - name: Smoke release
        run: node scripts/wasm_smoke.mjs target/wasm32-unknown-unknown/release/examples/wasm_smoke.wasm

  # 32-bit ALU: the 512 MiB arena constant and the frequent (safe) legacy
  # fallback change under a narrower pointer width. Needs multilib to link.
  bit32:
    name: i686
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: i686-unknown-linux-gnu
      - uses: Swatinem/rust-cache@v2
      # i686-unknown-linux-gnu has prebuilt std, but linking still needs a
      # 32-bit libc and 32-bit-capable gcc. Without this the job dies at
      # link time with a confusing "cannot find -lgcc_s" style error.
      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib libc6-dev-i386
      - run: cargo build --locked --target i686-unknown-linux-gnu --verbose
      - run: cargo test --locked --target i686-unknown-linux-gnu --verbose

  # The declared MSRV is a promise in Cargo.toml; this is what keeps it one.
  msrv:
    name: msrv 1.79
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.79.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --locked --verbose
      - run: cargo build --locked --no-default-features --verbose

  package:
    name: package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo package --locked

  # ---------------------------------------------------------------------------
  # Non-gating jobs. Scheduled/nightly only, or informational: each is slow,
  # depends on runner hardware we do not control, or reports numbers rather
  # than asserting them.
  # ---------------------------------------------------------------------------

  bench:
    name: bench (${{ matrix.os }})
    # Excluded from the push path: the full matrix is tens of minutes per OS
    # and a shared runner cannot host a measurement worth reading anyway.
    # Results are collected as artifacts for re-scoring, not as a gate.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Run matrix
        # pipefail is load-bearing: without it a failed `cargo bench` exits
        # zero because `tee` is last in the pipeline, and a broken build
        # gets uploaded as though it were a measurement.
        run: |
          set -o pipefail
          cargo bench --locked -- --nocapture 2>&1 | tee bench-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-${{ matrix.os }}
          path: bench-*.txt
          if-no-files-found: warn

  # jemalloc comparator — CI box has make+autoconf (dev box does not).
  # Runs the scoreboard with the extra column; uploaded for re-scoring
  # against the other OS bench artifacts.
  jemalloc-bench:
    name: bench (jemalloc)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install make + autoconf (jemalloc build)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq make autoconf
      - name: Run matrix with jemalloc column
        run: |
          set -o pipefail
          cargo bench --locked --features bench-jemalloc -- --nocapture 2>&1 | tee bench-jemalloc.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bench-jemalloc
          path: bench-jemalloc.txt
          if-no-files-found: warn

  miri:
    name: miri
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri
      - uses: Swatinem/rust-cache@v2
      - run: cargo +nightly miri setup
      # --lib only. Miri cannot execute the allocator's raw map/unmap
      # syscalls, so tests needing real mmap are cfg_attr(miri, ignore)d;
      # the span/big carve paths use std::alloc buffers and run here.
      # No MIRIFLAGS: strict provenance is the default now, and passing the
      # old -Zmiri-strict-provenance flag makes current nightly reject it
      # as an unknown option. The pointer-int casts in the header probes
      # are covered by the default strict mode.
      - run: cargo +nightly miri test --lib

  fuzz:
    name: fuzz
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      # actions-rs/install is archived and node12-based; taiki-e is the
      # maintained replacement and installs a prebuilt cargo-fuzz.
      - uses: taiki-e/install-action@cargo-fuzz
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz
      - run: cargo fuzz build
      - name: Smoke-run fuzz targets
        run: |
          cargo fuzz run alloc_seq -- -max_total_time=60
          cargo fuzz run zero_init_seq -- -max_total_time=60
          cargo fuzz run tier_boundary_seq -- -max_total_time=60

  # Kani proofs for the span/big-carving arithmetic and medium-page packing.
  # Proofs live in src/page.rs `kani_proofs` under
  # `#[cfg(all(kani, unix, feature = "std"))]`.
  kani:
    name: kani
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - run: cargo kani

  coverage:
    name: coverage
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Deliberately NOT --all-features: it enables every app-* backend at
      # once, which trips the compile_error! in examples/app_workload.rs,
      # and pulls in bench-jemalloc without make/autoconf installed. The
      # measured surface is the library and its tests.
      - name: Generate LCOV report
        run: cargo llvm-cov --locked --lib --tests --lcov --output-path lcov.info
      - name: Summary
        run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn

  profile:
    name: profile
    # Informational only: perf availability varies by runner kernel, so this
    # must never fail the workflow. Feeds the profile-guided tuning points
    # with counter data the dev box cannot produce (no PMU there).
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    continue-on-error: true
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install perf (best effort)
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq linux-tools-common linux-tools-generic
      - name: Build benches
        run: cargo bench --locked --no-run
      - name: perf stat on mixed-all 8T + spawn-churn
        continue-on-error: true
        run: |
          for wl in "mixed-all 8T" "spawn-churn"; do
            safe=$(echo "$wl" | tr ' ' '-')
            BENCH_SECS=2 BENCH_REPS=1 BENCH_ONLY="$wl" perf stat \
              -e task-clock,context-switches,cpu-migrations,page-faults,minor-faults,major-faults,cycles,instructions,cache-misses \
              -o "perf-${safe}.txt" cargo bench --locked --bench alloc -- --nocapture || true
          done
          ls perf-*.txt 2>/dev/null || echo "no perf output captured" > perf-unavailable.txt
      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-profiles
          path: perf-*.txt
          if-no-files-found: ignore