name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  schedule:
    # Weekly, off the hour to avoid the top-of-hour runner stampede.
    - cron: "37 4 * * 1"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        rust: [stable]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - run: cargo build --verbose
      - run: cargo test --verbose
      - run: cargo test --release --verbose

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings

  # Separate from lint because rustdoc under -D warnings also validates
  # intra-doc links, and a broken link in a public crate is a release bug.
  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo doc --no-deps
        env:
          RUSTDOCFLAGS: -Dwarnings

  # telemetry and no_std are separate compile universes: a change can be
  # green on default features and break either. The README lists both as
  # gates, so CI has to run them.
  features:
    name: telemetry + no_std
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - name: Telemetry build + tests
        run: |
          cargo build --features telemetry
          cargo test --features telemetry
      - name: no_std build (unix)
        run: cargo build --no-default-features
      - name: no_std build (wasm32)
        run: cargo build --no-default-features --target wasm32-unknown-unknown

  # The declared MSRV is a promise in Cargo.toml; this is what keeps it one.
  msrv:
    name: msrv 1.79
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.79.0
      - run: cargo build --verbose
      - run: cargo build --no-default-features --verbose

  package:
    name: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - run: cargo package

  wasm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-unknown-unknown
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo build --target wasm32-unknown-unknown --example wasm_smoke
      - run: node scripts/wasm_smoke.mjs target/wasm32-unknown-unknown/debug/examples/wasm_smoke.wasm
      - run: cargo build --release --target wasm32-unknown-unknown --example wasm_smoke
      - run: node scripts/wasm_smoke.mjs target/wasm32-unknown-unknown/release/examples/wasm_smoke.wasm

  bit32:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: i686-unknown-linux-gnu
      # i686-unknown-linux-gnu ships prebuilt std, but linking still needs a
      # 32-bit libc and a 32-bit-capable gcc. Without these the job dies at
      # link time with an unhelpful \"cannot find -lgcc_s\" style error.
      - name: Install 32-bit toolchain
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-multilib libc6-dev-i386
      # 32-bit ALU: 512 MiB arena const + frequent (safe) legacy fallback.
      # Runs natively on x86_64 runners; arena unit tests use small isolated
      # instances on any pointer width, so exhaustion/fallback shapes are
      # covered here too.
      - run: cargo build --target i686-unknown-linux-gnu --verbose
      - run: cargo test --target i686-unknown-linux-gnu --verbose

  bench:
    # Scheduled only. The full matrix is ~22 workloads x 6 allocators x
    # 5 reps x 3s plus warmup per OS, which is tens of minutes on a
    # shared runner that cannot host a meaningful measurement anyway
    # (see the README's measurement methodology section). Results are
    # uploaded as artifacts for re-scoring, not asserted as gates.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      # pipefail is load-bearing: without it a failed `cargo bench` exits
      # zero because `tee` is last in the pipeline, and a broken build gets
      # uploaded as though it were a measurement.
      - name: Run matrix
        run: |
          set -o pipefail
          cargo bench -- --nocapture 2>&1 | tee bench-${{ matrix.os }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.os }}
          path: bench-*.txt

  profile:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # Informational only: perf availability varies by runner kernel; this job
    # must never fail the build. Feeds the profile-guided tuning points
    # (mixed-all per-op latency, spawn-churn exit work) with counter data
    # the dev box cannot produce (no PMU there).
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install perf (best effort)
        continue-on-error: true
        run: sudo apt-get update -qq && sudo apt-get install -y -qq linux-tools-common linux-tools-generic
      - name: Build benches
        run: cargo bench --no-run
      - name: perf stat on mixed-all 8T + spawn-churn
        continue-on-error: true
        run: |
          for wl in "mixed-all 8T" "spawn-churn"; do
            safe=$(echo "$wl" | tr ' ' '-');
            BENCH_SECS=2 BENCH_REPS=1 BENCH_ONLY="$wl" perf stat -e task-clock,context-switches,cpu-migrations,page-faults,minor-faults,major-faults,cycles,instructions,cache-misses -o "perf-${safe}.txt" cargo bench --bench alloc -- --nocapture || true;
          done
          ls perf-*.txt 2>/dev/null || echo "no perf output captured" > perf-unavailable.txt
      - name: Upload profiles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-profiles
          path: perf-*.txt

  fuzz:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      # actions-rs/install is archived and node12-based; taiki-e is the
      # maintained replacement and installs a prebuilt cargo-fuzz.
      - uses: taiki-e/install-action@cargo-fuzz
      - run: cargo fuzz build
      - name: Smoke-run fuzz targets
        run: |
          cargo fuzz run alloc_seq -- -max_total_time=60
          cargo fuzz run zero_init_seq -- -max_total_time=60
          cargo fuzz run tier_boundary_seq -- -max_total_time=60

  miri:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      # Miri cannot execute real syscalls for map/unmap; unit tests that
      # need raw mmap are cfg_attr(miri, ignore). Span/big carve and
      # large_header_of probes use std::alloc buffers and run here.
      #
      # No MIRIFLAGS: strict provenance is the default now, and passing the
      # old -Zmiri-strict-provenance flag makes current nightly reject it
      # as an unknown option. The pointer-int casts in the header probes
      # are covered by the default strict mode.
      - run: cargo +nightly miri setup
      - run: cargo +nightly miri test --lib

  # Phase 0.3: Windows Fls path is exercised by the 3-OS `test` matrix
  # (windows-latest runs tests/thread_exit.rs + stress.rs) and the 3-OS
  # `bench` matrix — no separate job needed; kept as a comment so the
  # coverage is visible when reviewing CI.
  #
  # Phase 0.7: 3-OS bench matrix is the existing `bench` job above.

  coverage:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # Deliberately NOT --all-features: it enables every app-* backend at
      # once, which trips the compile_error! in examples/app_workload.rs,
      # and pulls in bench-jemalloc without make/autoconf installed. The
      # measured surface is the library and its tests.
      - name: Generate LCOV report
        run: cargo llvm-cov --lib --tests --lcov --output-path lcov.info
      - name: Summary
        run: cargo llvm-cov report --summary-only
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov
          path: lcov.info

  # Phase 0.4: jemalloc comparator — CI box has make+autoconf (dev box does
  # not). Runs the full 14-workload scoreboard with the extra column; upload
  # for re-scoring against the other OS bench artifacts.
  jemalloc-bench:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - name: Install make + autoconf (jemalloc build)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq make autoconf
      - name: Bench with jemalloc column
        run: |
          set -o pipefail
          cargo bench --features bench-jemalloc -- --nocapture 2>&1 | tee bench-jemalloc.txt
      - uses: actions/upload-artifact@v4
        with:
          name: bench-jemalloc
          path: bench-jemalloc.txt

  # Phase 0.6: Kani proofs for DESIGN_SPANS_BIG §6 P1–P6 (arithmetic bounds)
  # + medium-page packing. Nightly + kani-verifier; proofs live in
  # src/page.rs `kani_proofs` under `#[cfg(all(kani, unix, feature = "std"))]`.
  kani:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
      - name: Install Kani
        run: |
          cargo install --locked kani-verifier
          cargo kani setup
      - name: Run carving proofs
        run: cargo kani
